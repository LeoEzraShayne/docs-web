name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for Cloudflare Pages
        run: npm exec --yes --legacy-peer-deps --package=@cloudflare/next-on-pages@1.13.16 --package=vercel@47.0.4 --package=wrangler@4.100.0 -- next-on-pages

      - name: Deploy to Cloudflare Pages
        run: npm exec --yes --package=wrangler@4.100.0 -- wrangler pages deploy .vercel/output/static --project-name=docs --branch=main
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
