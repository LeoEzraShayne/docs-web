name: Check document catalog drift

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compare production contract with snapshot
        env:
          DOCUMENT_CATALOG_URL: https://api-docs.meritledger.org/document-catalog/v1
        run: npm run check:document-catalog
